<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'" />
  <title>LEGION Island</title>
  <link rel="stylesheet" href="styles/island.css" />
</head>
<body>
  <main id="island" class="island" data-state="IDLE" data-expanded="false" data-mode="COMPACT" data-activity="idle">
    <header class="island-head" id="island-head">
      <span class="island-dot" aria-hidden="true"></span>
      <span class="island-brand">LEGION</span>
      <span class="island-divider" aria-hidden="true"></span>
      <span class="island-state" id="island-state">IDLE</span>
      <span class="island-inline" id="island-inline" aria-hidden="true"></span>
      <span class="island-spacer"></span>
      <span class="island-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <button class="island-icon island-stop" id="island-stop" title="Stop" aria-label="Stop listening or generating" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="5" width="6" height="6" rx="1.4"/></svg>
      </button>
      <button class="island-icon" id="island-chevron" title="Expand" aria-label="Expand island">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
      </button>
    </header>

    <section class="island-body" aria-label="LEGION conversation">
      <div class="island-live" id="island-live">
        <span class="island-live-label" id="island-live-label">Ready</span>
        <p class="island-caption" id="island-caption">Ready when you are.</p>
      </div>

      <div class="island-thread" id="island-thread" role="log" aria-live="polite" aria-relevant="additions text"></div>

      <form class="island-compose" id="island-compose" autocomplete="off">
        <button type="button" class="island-icon is-mic" id="island-mic" title="Talk" aria-label="Start listening">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="6" y="2.5" width="4" height="7" rx="2"/><path d="M3.5 8a4.5 4.5 0 0 0 9 0M8 12.5V14"/></svg>
        </button>
        <input type="text" id="island-input" class="island-input" placeholder="Ask LEGION…" aria-label="Message LEGION"
               spellcheck="false" maxlength="8000" />
        <button type="submit" class="island-send" id="island-send" title="Send (Enter)" aria-label="Send message">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8l10.5-4.5L10 13l-2.6-3.4L2.5 8z"/><path d="M7.4 9.6L13 3.5"/></svg>
        </button>
      </form>

      <div class="island-actions">
        <button class="island-btn" id="island-open" title="Open the full LEGION window">Open LEGION</button>
        <button class="island-btn" id="island-settings" title="Open Settings">Settings</button>
        <span class="island-spacer"></span>
        <button class="island-btn is-icon" id="island-pin" title="Keep expanded" aria-label="Keep expanded" aria-pressed="false">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 2.5l4 4-2 1-2.5 2.5L8 13l-1-1-3.5 2 2-3.5-1-1 2.5-2.5 2.5-2.5 1-2z"/></svg>
        </button>
        <button class="island-btn is-icon" id="island-close" title="Hide the island" aria-label="Hide the island">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
    </section>
  </main>

  <script type="module" src="js/island.js"></script>
</body>
</html>
