<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="LEGION">
  <title>LEGION</title>
  <desc>Three arc segments of a ring, with gaps at 2, 6 and 10 o'clock.</desc>

  <defs>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ee6ff"/>
      <stop offset="55%" stop-color="#35c8ff"/>
      <stop offset="100%" stop-color="#1a7fb8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="96" fill="#070a12"/>

  <!--
    Ring geometry mirrors src/renderer/visuals/logo-model.js: arcs span 90deg,
    gaps are 30deg centred on 2, 6 and 10 o'clock. Drawn with stroke arcs so
    the SVG stays independent of the renderer's sampling.
    Centre 256,256 radius 150, stroke width 46.
  -->
  <g fill="none" stroke="url(#arc)" stroke-width="46" stroke-linecap="butt" filter="url(#glow)">
    <!-- arc centred on 12 o'clock -->
    <path d="M 149.93 149.93 A 150 150 0 0 1 362.07 149.93"/>
    <!-- arc centred on 4 o'clock -->
    <path d="M 400.89 217.18 A 150 150 0 0 1 294.82 400.89"/>
    <!-- arc centred on 8 o'clock -->
    <path d="M 217.18 400.89 A 150 150 0 0 1 111.11 217.18"/>
  </g>
</svg>
